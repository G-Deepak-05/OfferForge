spring.application.name=interview-service

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/offerforge}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:batman}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:darkknight}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# AI and Compiler Integrations
nvidia.nim.api-key=${NVIDIA_NIM_API_KEY:}
judge0.api-url=${JUDGE0_API_URL:http://localhost:2358}

# Allow CORS for Next.js frontend
server.port=8080
